<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>CDZ Admin</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --card-bg: rgba(28, 28, 30, 0.55);
      --card-inner: rgba(10, 10, 14, 0.6);
      --border: rgba(255, 255, 255, 0.08);
      --border-light: rgba(255, 255, 255, 0.24);
      --glass-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05),
                          inset 1.8px 3px 0px -2px rgba(255, 255, 255, 0.35),
                          inset -2px -2px 0px -2px rgba(255, 255, 255, 0.25),
                          0px 6px 16px 0px rgba(0, 0, 0, 0.25);
      --text: #ffffff;
      --text-muted: #8e8e93;
      --text-sub: #aeaeb2;
      --ease-ios: cubic-bezier(0.16, 1, 0.3, 1);
      --spring-nav: cubic-bezier(0.25, 1.35, 0.4, 1);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Inter", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px 14px 90px;
      font-weight: 700;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .header h1 { font-size: 24px; font-weight: 900; letter-spacing: -0.04em; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--card-bg);
      box-shadow: var(--glass-shadow);
      font-size: 11.5px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #30d158; }
    
    .subject-scroller {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 14px;
      scrollbar-width: none;
    }
    .subject-scroller::-webkit-scrollbar { display: none; }
    .subj-btn {
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--card-bg);
      box-shadow: var(--glass-shadow);
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: all 0.2s var(--ease-ios);
    }
    .subj-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 8px 24px -4px rgba(255, 255, 255, 0.18);
    }
    
    .glass-card {
      padding: 16px;
      background: var(--card-bg);
      box-shadow: var(--glass-shadow);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }
    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .tag {
      font-size: 10.5px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-light);
    }
    .card-title { font-size: 16px; font-weight: 900; }
    
    .form-input {
      width: 100%;
      height: 44px;
      border-radius: var(--radius-sm);
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 13.5px;
      font-weight: 700;
      padding: 0 14px;
      margin-bottom: 8px;
    }
    .q-row {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 8px;
      margin-bottom: 6px;
    }
    .q-badge {
      height: 44px;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text-muted);
    }
    .btn-dashed {
      height: 40px;
      border: 1px dashed var(--border-light);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-white {
      height: 44px;
      border-radius: 999px;
      background: #ffffff;
      color: #000000;
      font-size: 13.5px;
      font-weight: 900;
      border: none;
      cursor: pointer;
    }
    
    /* Нижний Apple-навбар */
    .fixed-nav-wrapper {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 340px;
      display: flex;
      justify-content: center;
      z-index: 100;
    }
    .apple-glass {
      width: 100%;
      height: 60px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      box-shadow: var(--glass-shadow);
      border-radius: 999px;
      display: flex;
      align-items: center;
      position: relative;
      padding: 0 6px;
    }
    .nav-tabs { flex: 1; display: flex; position: relative; height: 48px; }
    .nav-pill {
      position: absolute;
      width: 50%;
      height: 48px;
      top: 0; left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s var(--spring-nav);
      pointer-events: none;
    }
    .nav-pill-circle {
      width: 44px; height: 44px;
      background: #ffffff;
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(255,255,255,0.4);
    }
    .nav-btn {
      flex: 1;
      height: 48px;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .nav-btn svg { color: #8e8e93; transition: color 0.2s; }
    .nav-btn.active svg { color: #000000; }
    
    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body>

  <div class="header">
    <h1 id="titleText">База ответов</h1>
    <div class="badge">
      <div class="dot"></div>
      <span id="testsCount">0 ЦДЗ</span>
    </div>
  </div>

  <!-- Экран 1: Лента сохраненных тестов -->
  <div id="scr-feed" class="screen active">
    <div class="subject-scroller" id="subjectFilter">
      <button class="subj-btn active" data-sub="all">Все</button>
      <button class="subj-btn" data-sub="История">История</button>
      <button class="subj-btn" data-sub="Алгебра">Алгебра</button>
      <button class="subj-btn" data-sub="Геометрия">Геометрия</button>
      <button class="subj-btn" data-sub="Физика">Физика</button>
    </div>
    <div id="feedList"></div>
  </div>

  <!-- Экран 2: Конструктор для добавления в SQLite -->
  <div id="scr-admin" class="screen">
    <div class="glass-card">
      <div class="card-title">Добавить новое ЦДЗ</div>
      <input type="text" id="admSub" class="form-input" placeholder="Предмет (История, Алгебра...)">
      <input type="text" id="admTitle" class="form-input" placeholder="Название работы">
      <input type="text" id="admExtId" class="form-input" placeholder="ID теста из URL ЦДЗ (например, 739210)">

      <label style="font-size:11px; color:var(--text-muted); margin-bottom: 6px;">ОТВЕТЫ ПО ПОРЯДКУ</label>
      <div id="answersBuilder">
        <div class="q-row">
          <div class="q-badge">1</div>
          <input type="text" class="form-input adm-ans" style="margin-bottom:0;" placeholder="Ответ">
        </div>
        <div class="q-row">
          <div class="q-badge">2</div>
          <input type="text" class="form-input adm-ans" style="margin-bottom:0;" placeholder="Ответ">
        </div>
      </div>

      <button type="button" class="btn-dashed" id="btnAddQField">+ Добавить ответ</button>
      <button class="btn-white" onclick="publishTest()">Сохранить в базу телефона</button>
    </div>
  </div>

  <!-- Нижний навбар -->
  <div class="fixed-nav-wrapper">
    <nav class="apple-glass">
      <div class="nav-tabs">
        <div class="nav-pill" id="navPill">
          <div class="nav-pill-circle"></div>
        </div>
        <button class="nav-btn active" onclick="switchTab('feed', 0)" title="Лента">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
        </button>
        <button class="nav-btn" onclick="switchTab('admin', 1)" title="Конструктор">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
      </div>
    </nav>
  </div>

  <script>
    let localTests = [];
    let currentFilter = 'all';

    function loadLocalDB() {
      try {
        if (window.AndroidDB) {
          localTests = JSON.parse(AndroidDB.getAllTestsJson());
        }
      } catch (e) {
        localTests = [];
      }
      document.getElementById('testsCount').textContent = `${localTests.length} ЦДЗ`;
      renderFeed();
    }

    function renderFeed() {
      const list = document.getElementById('feedList');
      list.innerHTML = '';

      const filtered = localTests.filter(t => currentFilter === 'all' || t.subject === currentFilter);
      if (filtered.length === 0) {
        list.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted); font-size:13px;">В базе пока нет заданий</div>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'glass-card';
        card.innerHTML = `
          <div class="card-top">
            <span class="tag">${item.subject}</span>
            <span style="font-size:11px; color:var(--text-muted);">ID: ${item.test_id}</span>
          </div>
          <div class="card-title">${item.title}</div>
          <div style="font-size:12px; color:var(--text-sub);">Ответов в базе: ${item.answers.length}</div>
          <div style="background:var(--card-inner); padding:10px; border-radius:12px; font-size:12px; font-family:monospace; margin-top:6px;">
            ${item.answers.map((a, i) => `<div>${i+1}. ${a}</div>`).join('')}
          </div>
        `;
        list.appendChild(card);
      });
    }

    function switchTab(screen, idx) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`scr-${screen}`).classList.add('active');
      document.querySelectorAll('.nav-btn')[idx].classList.add('active');

      document.getElementById('navPill').style.transform = `translateX(${idx * 100}%)`;
      document.getElementById('titleText').textContent = idx === 0 ? 'База ответов' : 'Конструктор';
      if (idx === 0) loadLocalDB();
    }

    // Фильтр
    document.querySelectorAll('.subj-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.subj-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.sub;
        renderFeed();
      });
    });

    // Добавление строк вопросов
    let qCount = 2;
    document.getElementById('btnAddQField').addEventListener('click', () => {
      qCount++;
      const row = document.createElement('div');
      row.className = 'q-row';
      row.innerHTML = `<div class="q-badge">${qCount}</div><input type="text" class="form-input adm-ans" style="margin-bottom:0;" placeholder="Ответ">`;
      document.getElementById('answersBuilder').appendChild(row);
    });

    // Сохранение
    function publishTest() {
      const subject = document.getElementById('admSub').value.trim();
      const title = document.getElementById('admTitle').value.trim();
      const testId = document.getElementById('admExtId').value.trim();
      const answers = Array.from(document.querySelectorAll('.adm-ans')).map(i => i.value.trim()).filter(Boolean);

      if (!subject || !title || !testId || answers.length === 0) {
        alert('Заполните предмет, тему, ID и хотя бы один ответ!');
        return;
      }

      if (window.AndroidDB) {
        const ok = AndroidDB.saveTest(subject, title, testId, JSON.stringify(answers));
        if (ok) {
          alert('Успешно сохранено в телефон!');
          document.getElementById('admTitle').value = '';
          document.getElementById('admExtId').value = '';
          document.querySelectorAll('.adm-ans').forEach(i => i.value = '');
          switchTab('feed', 0);
        } else {
          alert('Ошибка записи в SQLite');
        }
      }
    }

    loadLocalDB();
  </script>
</body>
</html>
